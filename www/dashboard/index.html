<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zendure Automation</title>
<meta name="theme-color" content="#10b981">
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<link rel="icon" href="/logo.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zendure">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <img src="/logo.png" class="logo" alt="Zendure">
      <div class="title-block">
        <h1>Zendure Automation</h1>
        <span class="mode-badge" id="modeBadge">–</span>
      </div>
      <div class="conn-indicator" id="connIndicator" title="Verbindung"></div>
      <button type="button" class="hamburger-btn" id="menuBtn" aria-label="Menü" aria-haspopup="true">
        <span></span><span></span><span></span>
      </button>
    </header>

    <nav class="menu-overlay" id="menuOverlay" hidden>
      <div class="menu-panel" role="menu">
        <button type="button" class="menu-item" id="menuTelemetry" role="menuitem">📊 Telemetrie (heute)</button>
      </div>
    </nav>

    <main class="layout">
      <section class="flow-panel">
        <svg id="flowSvg" viewBox="0 0 520 520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Energiefluss">
          <defs>
            <radialGradient id="nodeGrad" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="var(--node-fill-hi)"></stop>
              <stop offset="100%" stop-color="var(--node-fill)"></stop>
            </radialGradient>
            <clipPath id="batteryClip">
              <rect x="389" y="200" width="72" height="120" rx="8"></rect>
            </clipPath>
          </defs>

          <g id="pvGroup" hidden>
            <line id="flowLinePvHouse" x1="260" y1="151" x2="260" y2="235" class="flow-line"></line>
            <g class="node node-pv" id="nodePv">
              <circle cx="260" cy="95" r="56"></circle>
              <text x="260" y="65" class="node-label">PV</text>
              <path class="node-icon" transform="translate(248,84) scale(1.05)" d="M3 6h18v12H3z M9 6v12 M15 6v12 M3 12h18 M12 18v4 M8 22h8" fill="none" stroke="var(--text-muted)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path>
              <text x="260" y="129" class="node-value" id="pvPowerValue">– W</text>
            </g>
          </g>

          <!-- Free-floating live metrics, not wired into the flow - purely derived client-side, no dedicated datapoints -->
          <g class="node node-metric" id="nodeAutarky">
            <circle cx="95" cy="95" r="56" id="autarkyRing"></circle>
            <text x="95" y="65" class="node-label">Autarkie</text>
            <path class="node-icon" transform="translate(83,84) scale(1.05)" d="M12 2 20 5.5 V11 C20 16 16.5 20 12 22 C7.5 20 4 16 4 11 V5.5 Z M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="var(--text-muted)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path>
            <text x="95" y="129" class="node-value" id="autarkyValue">–%</text>
          </g>

          <g class="node node-metric" id="nodeSelfConsumption">
            <circle cx="425" cy="95" r="56" id="selfConsumptionRing"></circle>
            <text x="425" y="65" class="node-label">Eigenverbrauch</text>
            <path class="node-icon" transform="translate(413,84) scale(1.05)" d="M12 3v3 M12 18v3 M4.6 4.6l2.1 2.1 M17.3 17.3l2.1 2.1 M3 12h3 M18 12h3 M4.6 19.4l2.1-2.1 M17.3 6.7l2.1-2.1" fill="none" stroke="var(--text-muted)" stroke-width="1.6" stroke-linecap="round"></path>
            <circle class="node-icon" cx="12" cy="12" r="4" transform="translate(413,84) scale(1.05)" fill="none" stroke="var(--text-muted)" stroke-width="1.6"></circle>
            <text x="425" y="129" class="node-value" id="selfConsumptionValue">–%</text>
          </g>

          <line id="flowLineGridHub" x1="151" y1="260" x2="235" y2="260" class="flow-line"></line>
          <line id="flowLineHausHub" x1="260" y1="369" x2="260" y2="285" class="flow-line"></line>
          <line id="flowLineBatteryHub" x1="285" y1="260" x2="385" y2="260" class="flow-line"></line>

          <g class="node node-grid" id="nodeGrid">
            <circle cx="95" cy="260" r="56"></circle>
            <text x="95" y="230" class="node-label">Netz</text>
            <path class="node-icon" transform="translate(83,250) scale(0.95)" d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" fill="var(--text-muted)" stroke="none"></path>
            <text x="95" y="294" class="node-value" id="gridPowerValue">– W</text>
          </g>

          <g class="node node-house" id="nodeHaus">
            <circle cx="260" cy="425" r="56"></circle>
            <text x="260" y="395" class="node-label">Haus</text>
            <path class="node-icon" transform="translate(248,414) scale(1.05)" d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10" fill="none" stroke="var(--text-muted)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path>
            <text x="260" y="459" class="node-value" id="housePowerValue">– W</text>
          </g>

          <g class="node node-battery" id="batteryHero">
            <text x="425" y="176" class="node-label">Batterie</text>
            <rect x="411" y="183" width="28" height="12" rx="4" class="battery-cap"></rect>
            <rect x="385" y="196" width="80" height="128" rx="12" class="battery-body"></rect>
            <g clip-path="url(#batteryClip)">
              <rect x="389" y="260" width="72" height="0" class="battery-fill" id="batteryFillRect"></rect>
            </g>
            <text x="425" y="342" class="node-value" id="batteryPowerValue">– W</text>
            <text x="425" y="358" class="node-soc" id="batterySocValue">–%</text>
          </g>

          <g class="hub" id="hub">
            <line x1="260" y1="243" x2="260" y2="235" class="hub-pin"></line>
            <line x1="277" y1="260" x2="285" y2="260" class="hub-pin"></line>
            <line x1="260" y1="277" x2="260" y2="285" class="hub-pin"></line>
            <line x1="243" y1="260" x2="235" y2="260" class="hub-pin"></line>
            <rect x="243" y="243" width="34" height="34" rx="10" class="hub-body"></rect>
            <circle cx="260" cy="260" r="4" class="hub-dot" id="hubDot"></circle>
          </g>
        </svg>

        <div class="device-cards" id="deviceCards" hidden></div>
      </section>

      <aside class="control-panel" id="controlPanel">
        <h2>Steuerung</h2>
        <div class="control-list" id="controlList"></div>
        <p class="control-hint" id="controlHint" hidden>ℹ️ Waterfill-Verteilung aktiv: Max. Lade-/Entladeleistung wird pro Gerät festgelegt – siehe ⚙ an der jeweiligen Gerätekarte.</p>
      </aside>
    </main>

    <footer class="statusbar">
      <span id="emergencyReason"></span>
      <span id="lastUpdate"></span>
    </footer>
  </div>

  <div class="modal-overlay" id="detailsOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detailsTitle">
      <div class="modal-head">
        <h3 id="detailsTitle">Batteriedaten</h3>
        <button type="button" class="modal-close" id="detailsClose" aria-label="Schließen">&times;</button>
      </div>
      <div class="modal-body" id="detailsBody"></div>
    </div>
  </div>

  <div class="modal-overlay" id="telemetryOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="telemetryTitle">
      <div class="modal-head">
        <h3 id="telemetryTitle">Telemetrie – heute</h3>
        <button type="button" class="modal-close" id="telemetryClose" aria-label="Schließen">&times;</button>
      </div>
      <div class="modal-body" id="telemetryBody"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
